[package]
name = "rust-quality-analyzer"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "rust_quality_analyzer"
path = "src/lib.rs"

[[bin]]
name = "rust_quality_analyzer"
path = "src/main.rs"

[dependencies]
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
syn = { version = "=2.0.119", features = ["full", "parsing", "visit"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
