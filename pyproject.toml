[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
python_files = ["test_*.py"]
testpaths = ["tools/tests"]
